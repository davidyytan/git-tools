# Azure Pipelines port of the git-tools version bump workflow (classic Git Flow).
#
# This file belongs in the TARGET Azure DevOps repo (not in git-tools itself):
#   azure-pipelines/version-bump-git-flow-classic.yml
#
# It mirrors .github/workflows/version-bump-git-flow-classic.yml.example:
#   - develop -> tagged alpha prereleases on the upcoming release line
#   - release/<x.y.z> stabilizes that line as rc prereleases
#   - master -> stable releases
#   - hotfix/** -> patch rc prereleases, then stable on master
#
# Setup (full runbook: azure-devops-port-handoff.md sections 6-7):
#   1. One-time repo settings: disable the "PR ID in commit messages" prefix
#      (Sprint 270+), and allow the build service identity
#      "<project> Build Service (<org>)" to Contribute / Create tag / Create branch.
#   2. Upload the bot GPG private key (armored, no passphrase) as a Secure File
#      named per the GPG_SECURE_FILE variable below.
#   3. Import this pipeline, then queue it once manually to authorize
#      pipeline -> repo access if the project protects repository access.
#
# NOTE: GIT_TOOLS_REPO/GIT_TOOLS_REF currently point at a temp public mirror
# (kelliecsw/temp-git-tools) that carries the ADO subject fix for testing;
# switch back to davidyytan/git-tools at master once that work merges.

trigger:
  branches:
    include:
      - master
      - develop
      - release/*
      - hotfix/*
      - feature/*
      - bugfix/*

# The flow reacts to branch pushes; do not also run as a PR validation build.
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  # git-tools is cloned from a temp public GitHub mirror for initial testing.
  GIT_TOOLS_REPO: https://github.com/kelliecsw/temp-git-tools.git
  # Branch that carries the ADO subject fix; point at master on
  # davidyytan/git-tools once the feature line merges for real.
  GIT_TOOLS_REF: fix/ado-merged-pr-subject-prefix
  # Project-scoped signing identity; no Azure DevOps user account is needed.
  GIT_BOT_NAME: MyProject Versioning Automation       # <-- replace MyProject
  GIT_BOT_EMAIL: myproject-versioning@automation.invalid  # <-- match the GPG key user ID
  # Exact project-scoped filename under Pipelines > Library > Secure files.
  GPG_SECURE_FILE: myproject-versioning-gpg-private.asc

steps:
  - checkout: self
    fetchDepth: 0 # full history: the engine reads origin/develop and origin/master
    fetchTags: true # new pipelines otherwise skip tags; the engine needs them
    persistCredentials: true # later steps push as the build service identity

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - bash: git clone --branch "$(GIT_TOOLS_REF)" "$(GIT_TOOLS_REPO)" "$(Agent.TempDirectory)/git-tools"
    displayName: Clone git-tools

  - bash: |
      set -euo pipefail
      export BRANCH_NAME="${BUILD_SOURCEBRANCH#refs/heads/}"
      export PYTHONPATH="$(Agent.TempDirectory)/git-tools"
      python - <<'PY'
      import os
      from pathlib import Path

      from git_tools.generators.bumpgen import decide_version_strategy

      decision = decide_version_strategy(Path.cwd(), os.environ["BRANCH_NAME"], flow="classic")
      for key, value in decision.outputs().items():
          value = value.replace("\r", " ").replace("\n", " ")
          print(f"##vso[task.setvariable variable={key}]{value}")
      PY
    displayName: Decide version strategy
    env:
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)

  - bash: |
      echo "skip=$(skip)"
      echo "invalid=$(invalid)"
      echo "mode=$(mode)"
      echo "reason=$(reason)"
      echo "error=$(error)"
      echo "release_target=$(release_target)"
      echo "hotfix_target=$(hotfix_target)"
      echo "current_version=$(current_version)"
      echo "current_release_line=$(current_release_line)"
      echo "master_version=$(master_version)"
      echo "master_release_line=$(master_release_line)"
      echo "bootstrap_commitizen_version_ok=$(bootstrap_commitizen_version_ok)"
      echo "bootstrap_subject_ok=$(bootstrap_subject_ok)"
      echo "current_is_prerelease=$(current_is_prerelease)"
      echo "bump_eligible=$(bump_eligible)"
      echo "branch_gate_ref=$(branch_gate_ref)"
      echo "branch_has_unique_commits=$(branch_has_unique_commits)"
      echo "create_tag=$(create_tag)"
      echo "subject=$(subject)"
      echo "args=$(args)"
    displayName: Show decision

  - bash: |
      echo "$(error)"
      exit 1
    displayName: Fail invalid release branch configuration
    condition: eq(variables['invalid'], 'true')

  - task: DownloadSecureFile@1
    name: gpgKey
    displayName: Download bot GPG private key
    inputs:
      secureFile: '$(GPG_SECURE_FILE)'
    condition: and(succeeded(), ne(variables['skip'], 'true'), ne(variables['invalid'], 'true'))

  - bash: |
      set -euo pipefail
      mkdir -p ~/.gnupg
      chmod 700 ~/.gnupg
      gpg --batch --import "$(gpgKey.secureFilePath)"
      FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
      echo "$FPR:6:" | gpg --import-ownertrust
      git config --global user.signingkey "$FPR"
      git config --global commit.gpgsign true
      git config --global tag.gpgsign true
      echo "Imported GPG key $FPR"
    displayName: Import GPG key
    condition: and(succeeded(), ne(variables['skip'], 'true'), ne(variables['invalid'], 'true'))

  - bash: |
      set -euo pipefail
      git config user.name "$(GIT_BOT_NAME)"
      git config user.email "$(GIT_BOT_EMAIL)"
      git fetch --force --tags origin
      PYTHONPATH="$(Agent.TempDirectory)/git-tools" python -m git_tools.generators.bumpgen $(args)
    displayName: Run version bump
    condition: and(succeeded(), ne(variables['skip'], 'true'), ne(variables['invalid'], 'true'))

  - bash: |
      set -euo pipefail
      BRANCH_NAME="${BUILD_SOURCEBRANCH#refs/heads/}"
      git push origin "HEAD:refs/heads/$BRANCH_NAME"
      if [ "$(create_tag)" = "true" ]; then
        git push origin --tags
      fi
    displayName: Push changes
    condition: and(succeeded(), ne(variables['skip'], 'true'), ne(variables['invalid'], 'true'))
    env:
      BUILD_SOURCEBRANCH: $(Build.SourceBranch)
